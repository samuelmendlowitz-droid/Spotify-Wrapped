<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101612"><title>Wrapped Challenge 2026</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f4faf5;background:#101612}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}.wrap{max-width:760px;margin:auto;padding:20px 16px 100px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:20px;font-weight:850;letter-spacing:-.7px}.brand span{color:#1ed760}.pill{font-size:12px;border-radius:99px;background:#263b2b;color:#9df0b1;padding:7px 12px}.hero{padding:26px 22px;background:linear-gradient(135deg,#235d39,#16271c);border-radius:24px;margin-bottom:16px}h1{font-size:30px;line-height:1.12;margin:8px 0 12px;letter-spacing:-1px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.muted{color:#a8b7ac}.small{font-size:13px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#a6e9b7}.panel{background:#1b241e;border:1px solid #2a3a2e;border-radius:19px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#233128;padding:14px 8px;border-radius:14px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#b5c4b9}.btn{background:#1ed760;color:#07190c;font-weight:800;border-radius:13px;padding:13px 18px}.btn.secondary{background:#2b3b30;color:#f2fff4}.btn.warn{background:#e8b860;color:#211900}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;border:1px solid #394a3e;background:#121b15;border-radius:12px;padding:13px;color:white;outline:none;min-width:0}.field:focus{border-color:#1ed760}.field:disabled{opacity:.65}.entry{display:flex;align-items:center;gap:11px;margin:8px 0}.rank{width:29px;flex:none;text-align:right;color:#8da794;font-size:13px;font-weight:800}.entry .field{flex:1}.suggest-wrap{flex:1;min-width:0;position:relative}.suggest-wrap .field{width:100%}.suggestions{position:absolute;top:100%;left:0;right:0;background:#273a2c;border:1px solid #4a7354;border-radius:10px;z-index:8;max-height:210px;overflow:auto;box-shadow:0 12px 25px #0008}.suggestions button{display:block;width:100%;text-align:left;padding:11px;color:white;background:transparent;border-bottom:1px solid #3d5543}.suggestions button:active{background:#3d6247}.tabs{display:flex;gap:7px;margin:16px 0}.tab{flex:1;background:#28362c;color:#b7c6bb;padding:12px 5px;border-radius:11px;font-weight:750}.tab.active{background:#1ed760;color:#08180d}.nav{position:fixed;bottom:0;left:0;right:0;background:#18211b;border-top:1px solid #344337;display:flex;justify-content:center;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{width:min(25%,180px);background:transparent;color:#9daf9f;padding:8px 2px;font-size:12px}.nav button.active{color:#1ed760;font-weight:800}.notice{border-radius:12px;background:#2a352b;padding:13px;margin:12px 0;color:#dce8df;font-size:13px}.error{background:#56312e;color:#ffd2ce}.player{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:#243027;color:white;border-radius:13px;padding:15px;margin:9px 0}.player b{font-size:16px}.score{font-weight:850;color:#1ed760}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair>div{overflow-wrap:anywhere}.line{border-top:1px solid #354437;padding:9px 0;font-size:13px}.hidden{display:none!important}.saving{font-size:12px;color:#a7b7ab}.highlight{color:#1ed760}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:7px;background:#334336;border-radius:10px;overflow:hidden;margin:9px 0}.progress>div{height:100%;background:#1ed760}.spacer{height:8px}@media(max-width:440px){h1{font-size:26px}.wrap{padding-left:12px;padding-right:12px}.panel{padding:14px}.brand{font-size:18px}}
</style></head><body><div class="wrap"><header><div class="brand">◉ <span>Wrapped</span> Challenge</div><span class="pill" id="phase">Loading…</span></header><main id="app"><div class="panel">Connecting to your family game…</div></main></div><nav class="nav" id="nav"></nav><script>
const CATS={artists:5,songs:30,genres:5},LABEL={artists:'Artists',songs:'Songs',genres:'Genres'},MAX={artists:500,songs:350,genres:150};let state={phase:'predictions',players:[]},me=localStorage.getItem('wrapped-player-id'),myData=null,page='home',tab='artists',editing='predictions',timer=null,saveSequence=0;const app=document.getElementById('app'),nav=document.getElementById('nav');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const empty=()=>Object.fromEntries(Object.entries(CATS).map(([k,n])=>[k,Array(n).fill('')]));const count=a=>Object.values(a).reduce((n,x)=>n+x.filter(v=>v.trim()).length,0);
async function api(path,options){const r=await fetch('/api/'+path,{headers:{'content-type':'application/json'},...options});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d;}const post=(p,data)=>api(p,{method:'POST',body:JSON.stringify(data)});
function toast(msg,error=false){let old=document.querySelector('#toast');if(old)old.remove();const el=document.createElement('div');el.id='toast';el.className='notice'+(error?' error':'');el.textContent=msg;app.prepend(el);setTimeout(()=>el.remove(),4500)}
async function refresh(){state=await api('state');if(me){try{myData=await api('player-data?id='+encodeURIComponent(me))}catch{me=null;myData=null;localStorage.removeItem('wrapped-player-id')}}render();}
function navigate(p){page=p;render();window.scrollTo(0,0)}function render(){document.getElementById('phase').textContent=state.phase==='predictions'?'● Predictions open':'🔒 Predictions locked';nav.innerHTML=[['home','⌂ Home'],['mine','♫ My Wrapped'],['players','♧ Players'],['scores','★ Scores']].map(([k,t])=>`<button class="${page===k?'active':''}" data-nav="${k}">${t}</button>`).join('');if(page==='home')home();else if(page==='mine')mine();else if(page==='players')players();else scores();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));}
function home(){let n=state.players.length,filled=state.players.filter(p=>Object.values(p.filled).every((v,i)=>v===Object.values(CATS)[i])).length;app.innerHTML=`<section class="hero"><div class="eyebrow">2026 FAMILY COMPETITION</div><h1>How well do you know your music?</h1><p class="muted">Predict your Wrapped. Compare your picks. Climb the leaderboard.</p><button class="btn" id="heroBtn">${!me?'Join the game':state.phase==='predictions'?'Continue my predictions':'See my Wrapped'}</button></section><div class="grid"><div class="stat"><b>${n}</b><span>Players</span></div><div class="stat"><b>${filled}</b><span>Complete picks</span></div><div class="stat"><b>1,000</b><span>Max points</span></div></div><section class="panel"><h2>${state.phase==='predictions'?'Predictions are open':'Predictions are locked'}</h2><p class="muted">${state.phase==='predictions'?'Everyone’s guesses remain private until the organizer locks the game.':'Predictions are now visible to everyone. Enter your actual Wrapped to see your score.'}</p><div class="grid"><div class="stat"><b>5</b><span>Artists</span></div><div class="stat"><b>30</b><span>Songs</span></div><div class="stat"><b>5</b><span>Genres</span></div></div></section><section class="panel"><h3>Organizer controls</h3><p class="muted small">Only the organizer can lock or reopen predictions.</p><button class="btn secondary" id="adminBtn">Manage game</button></section>`;document.getElementById('heroBtn').onclick=()=>navigate('mine');document.getElementById('adminBtn').onclick=adminDialog;}
function join(){app.innerHTML=`<section class="panel"><h2>Join your family game</h2><p class="muted">Enter your name, or enter the same name to return to your existing predictions.</p><form id="joinForm"><input class="field" id="name" placeholder="Your name" maxlength="60" required minlength="2" autocomplete="name"><div class="spacer"></div><button class="btn full">Continue</button></form><p class="muted small">No password: anyone who selects your name can edit your entries. Please respect each other's picks.</p></section>`;document.getElementById('joinForm').onsubmit=async e=>{e.preventDefault();try{let p=await post('player',{name:document.getElementById('name').value});me=p.id;localStorage.setItem('wrapped-player-id',me);myData=await api('player-data?id='+encodeURIComponent(me));render()}catch(e){toast(e.message,true)}};}
function mine(){if(!me){if(state.phase==='predictions')return join();app.innerHTML='<section class="panel">You did not join before predictions locked. Ask the organizer to reopen predictions if you need to join.</section>';return;}editing=state.phase==='predictions'?'predictions':'actual';let list=myData?.[editing]||empty(),editable=true;app.innerHTML=`<div class="summary"><div><h2>${state.phase==='predictions'?'My Predictions':'My Actual Wrapped'}</h2><div class="muted small">${esc(myData?.name)} · ${state.phase==='predictions'?'Auto-saved predictions':'Enter your actual rankings'}</div></div><span class="saving" id="saving">Saved</span></div>${state.phase==='results'?'<div class="notice">Predictions are locked. These fields are for your actual Spotify Wrapped results, not your guesses.</div>':''}<div class="tabs">${Object.keys(CATS).map(k=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${LABEL[k]}</button>`).join('')}</div><section class="panel"><h2>Top ${CATS[tab]} ${LABEL[tab]}</h2><p class="muted small">${tab==='songs'?'Enter song title and artist together (e.g. Song — Artist).':'Enter one name per position.'}</p><div id="fields">${list[tab].map((v,i)=>`<div class="entry"><span class="rank">${i+1}</span><div class="suggest-wrap"><input class="field" data-index="${i}" value="${esc(v)}" placeholder="${tab==='songs'?'Song — Artist':tab==='artists'?'Artist name':'Genre'}" maxlength="160" autocomplete="off"><div class="suggestions hidden"></div></div></div>`).join('')}</div><div class="spacer"></div><div class="summary"><span class="muted small" id="progressText">${list[tab].filter(Boolean).length}/${CATS[tab]} completed</span><button class="btn secondary" id="nextTab">Next section →</button></div></section><p class="muted small">Changes save automatically. Empty fields are allowed, but only matching predictions can earn points.</p>${state.phase==='results'?'<button class="btn secondary full" id="viewMyScore">View my score →</button>':''}`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{await flush();tab=b.dataset.tab;render()});document.querySelectorAll('[data-index]').forEach(input=>input.oninput=()=>{myData[editing][tab][Number(input.dataset.index)]=input.value;document.getElementById('saving').textContent='Unsaved…';document.getElementById('progressText').textContent=myData[editing][tab].filter(x=>x.trim()).length+'/'+CATS[tab]+' completed';scheduleSave();showSuggestions(input)});document.getElementById('nextTab').onclick=async()=>{await flush();tab=tab==='artists'?'songs':tab==='songs'?'genres':'artists';render()};if(state.phase==='results')document.getElementById('viewMyScore').onclick=async()=>{await flush();navigate('scores')};}
function showSuggestions(input){const menu=input.nextElementSibling;if(!menu)return;menu.innerHTML='';menu.classList.add('hidden');if(editing!=='actual'||!myData||input.value.trim().length<2)return;const query=input.value.trim().toLowerCase();const normalize=s=>s.toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu,' ').trim();const q=normalize(query);const choices=myData.predictions[tab].map((name,i)=>({name,i})).filter(x=>x.name&&normalize(x.name).startsWith(q)).slice(0,8);if(!choices.length)return;for(const item of choices){const button=document.createElement('button');button.type='button';button.textContent='#'+(item.i+1)+' · '+item.name;button.onmousedown=e=>e.preventDefault();button.onclick=()=>{input.value=item.name;input.dispatchEvent(new Event('input',{bubbles:true}));menu.classList.add('hidden');input.focus();};menu.appendChild(button);}menu.classList.remove('hidden');input.onblur=()=>setTimeout(()=>menu.classList.add('hidden'),180);}
function scheduleSave(){clearTimeout(timer);timer=setTimeout(()=>flush(),650)}async function flush(){clearTimeout(timer);if(!myData||!me)return;const serial=++saveSequence,section=editing,payload=JSON.parse(JSON.stringify(myData[section]));const indicator=document.getElementById('saving');if(indicator)indicator.textContent='Saving…';try{await post('save',{id:me,type:section,lists:payload});if(serial===saveSequence){const el=document.getElementById('saving');if(el)el.textContent='✓ Saved';} }catch(e){const el=document.getElementById('saving');if(el)el.textContent='Save failed';toast(e.message,true)}}
function players(){app.innerHTML=`<h2>Family Players</h2><p class="muted small">${state.phase==='predictions'?'Predictions are hidden until the organizer locks them.':'Tap a player to view their predictions and actual results.'}</p>${state.players.length?state.players.map(p=>`<button class="player" data-id="${esc(p.id)}"><div><b>${esc(p.name)}</b><div class="muted small">${Object.values(p.filled).reduce((a,b)=>a+b,0)}/40 predictions filled</div></div><span>${state.phase==='predictions'?'🔒':'View →'}</span></button>`).join(''):'<div class="panel">No players yet.</div>'}`;if(state.phase==='results')document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showPlayer(b.dataset.id));}
function showPlayer(id){let p=state.players.find(x=>x.id===id);if(!p)return;let sections=Object.keys(CATS).map(cat=>`<section class="panel"><div class="summary"><h3>${LABEL[cat]}</h3><b class="highlight">${p.score?p.score.category[cat]+' pts':''}</b></div><div class="pair"><b class="muted small">PREDICTED</b><b class="muted small">ACTUAL</b></div>${Array.from({length:CATS[cat]},(_,i)=>{let d=p.score?.details[cat]?.[i];return `<div class="line pair"><div>${i+1}. ${esc(p.predictions?.[cat]?.[i]||'—')}${d&&d.points?` <span class="highlight">+${d.points}</span>`:d?.needsReview?' <span style="color:#e8b860">⚠ Check match</span>':''}</div><div>${i+1}. ${esc(p.actual?.[cat]?.[i]||'—')}</div></div>`}).join('')}</section>`).join('');app.innerHTML=`<button class="btn secondary" id="back">← Players</button><div class="spacer"></div><h2>${esc(p.name)}'s Wrapped</h2><p class="muted">${p.score?'Total: '+p.score.total+' / 1,000 points':'Awaiting actual results'}</p>${sections}`;document.getElementById('back').onclick=()=>navigate('players');}
function scores(){if(state.phase==='predictions'){app.innerHTML='<section class="panel"><h2>Leaderboard</h2><p class="muted">Scores will appear once predictions are locked and actual results are entered.</p></section>';return}let ranked=state.players.filter(p=>p.hasResults).sort((a,b)=>b.score.total-a.score.total),pending=state.players.filter(p=>!p.hasResults);app.innerHTML=`<h2>Leaderboard 🏆</h2><p class="muted small">Scores update as players enter their actual Wrapped.</p><div class="tabs"><button class="tab active" data-sort="total">Overall</button><button class="tab" data-sort="artists">Artists</button><button class="tab" data-sort="songs">Songs</button><button class="tab" data-sort="genres">Genres</button></div><div id="rankings"></div>${pending.length?`<section class="panel"><h3>Awaiting results</h3><p class="muted">${pending.map(p=>esc(p.name)).join(', ')}</p></section>`:''}`;function sortBy(key){document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('active',b.dataset.sort===key));let sorted=[...ranked].sort((a,b)=>(key==='total'?b.score.total-a.score.total:b.score.category[key]-a.score.category[key]));document.getElementById('rankings').innerHTML=sorted.length?sorted.map((p,i)=>`<button class="player" data-id="${esc(p.id)}"><div><b>${i+1}. ${esc(p.name)}</b><div class="muted small">Artists ${p.score.category.artists} · Songs ${p.score.category.songs} · Genres ${p.score.category.genres}</div></div><span class="score">${key==='total'?p.score.total:p.score.category[key]} pts</span></button>`).join(''):'<section class="panel">No results submitted yet.</section>';document.querySelectorAll('#rankings [data-id]').forEach(b=>b.onclick=()=>showPlayer(b.dataset.id))}document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>sortBy(b.dataset.sort));sortBy('total');}
function adminDialog(){app.innerHTML=`<section class="panel"><h2>Organizer controls</h2><p class="muted">${state.phase==='predictions'?'Lock predictions to reveal everyone’s guesses and open actual-results entry.':'Reopening predictions hides guesses and results again, and allows edits.'}</p><form id="adminForm"><label class="muted small" for="pin">Organizer PIN</label><input id="pin" class="field" type="password" required placeholder="PIN" autocomplete="off"><div class="spacer"></div><button class="btn ${state.phase==='results'?'warn':''} full">${state.phase==='predictions'?'Lock predictions & open results':'Reopen predictions'}</button></form></section><button class="btn secondary" id="back">← Back</button>`;document.getElementById('back').onclick=()=>navigate('home');document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();let target=state.phase==='predictions'?'results':'predictions';if(!confirm(target==='results'?'Lock all predictions? No further edits will be allowed until reopened.':'Reopen predictions for everyone? This will hide all predictions and scores again.'))return;try{await post('admin',{pin:document.getElementById('pin').value,phase:target});await refresh();navigate('home')}catch(e){toast(e.message,true)}}}
refresh().catch(e=>{app.innerHTML=`<section class="panel"><h2>Setup required</h2><p class="muted">${esc(e.message)}</p><p>Deploy the Worker and initialize its D1 database. See README.md for instructions.</p></section>`});setInterval(()=>{if(document.activeElement?.tagName==='INPUT'||timer)return;api('state').then(s=>{if(s.phase!==state.phase){refresh();return}state=s;if(page==='home'||page==='players'||page==='scores')render()}).catch(()=>{})},12000);
</script></body></html>
